services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: minus1days
      POSTGRES_PASSWORD: minus1days
      POSTGRES_DB: minus1days
    ports:
      - "5432:5432"
    volumes:
      - minus1days_pgdata:/var/lib/postgresql/data

volumes:
  minus1days_pgdata:
